          test "$(grep -c 'ST18C:FB-PROD-ROUTES-SKIP' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18C:FB-DEBUG-ROUTES-SKIP' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST11-FB10' NootedGreen/kern_gen11.cpp)" -eq 0
          test "$(grep -c 'ST11-FB21' NootedGreen/kern_gen11.cpp)" -eq 0
          test "$(grep -c 'ST18:FB-DBG-SKIP' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ngreenforcefb' NootedGreen/kern_gen11.cpp)" -eq 0

      - name: Stage18E - bypass only the unresolved probePortMode virtual call
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY18E'
          from pathlib import Path

          source_path = Path("NootedGreen/kern_gen11.cpp")
          source = source_path.read_text()

          # Stage18C is the baseline. Stage18D's PowerWell/PGE/AUX/DDI routes must
          # not be present in this isolation build.
          if "ST18D:" in source or "st18dPwCommonRequests" in source:
              raise SystemExit("Stage18E safety: Stage18D route code is present")

          if source.count("const bool st18cEnableFBRoutes = false;") != 1:
              raise SystemExit("Stage18E safety: Stage18C route guard changed")
          if source.count("if (st18cEnableFBRoutes) {") != 3:
              raise SystemExit("Stage18E safety: expected three disabled Stage18C route groups")

          # Validate the exact 14.8.9 (23J631) debug and production call sites
          # committed in sle_Internal before adding the runtime lookup patch.
          debug_binary = Path(
              "sle_Internal/le/AppleIntelTGLGraphicsFramebuffer.kext/Contents/MacOS/"
              "AppleIntelTGLGraphicsFramebuffer"
          ).read_bytes()
          prod_binary = Path(
              "sle_Internal/lep/AppleIntelTGLGraphicsFramebuffer.kext/Contents/MacOS/"
              "AppleIntelTGLGraphicsFramebuffer"
          ).read_bytes()

          debug_find = bytes.fromhex(
              "48 8b 08 48 89 c7 ff 91 90 01 00 00 83 f8 02"
          )
          prod_find = bytes.fromhex(
              "48 8b 08 48 89 c7 ff 91 78 01 00 00 83 f8 02"
          )
          replacement = bytes.fromhex(
              "b8 02 00 00 00 90 90 90 90 90 90 90 83 f8 02"
          )

          checks = [
              ("debug pattern in debug binary", debug_binary.count(debug_find), 1),
              ("debug pattern in production binary", prod_binary.count(debug_find), 0),
              ("production pattern in production binary", prod_binary.count(prod_find), 1),
              ("production pattern in debug binary", debug_binary.count(prod_find), 0),
              ("replacement in debug binary before patch", debug_binary.count(replacement), 0),
              ("replacement in production binary before patch", prod_binary.count(replacement), 0),
          ]
          for label, actual, expected in checks:
              if actual != expected:
                  raise SystemExit(
                      f"Stage18E binary safety: {label}: expected {expected}, found {actual}"
                  )

          anchor = "\t\t//powerwell\n"
          if source.count(anchor) != 1:
              raise SystemExit(
                  f"Stage18E source anchor count={source.count(anchor)}, expected 1"
              )

          insertion = "\n".join([
              "\t\t// Stage18E: the Stage18C panic return address PowerWell::init+0x14bb",
              "\t\t// is the instruction immediately after AppleIntelPortHAL::probePortMode().",
              "\t\t// HookCase is present in AuxKC, yet this vtable slot still reaches",
              "\t\t// __cxa_pure_virtual. Replace only that indirect call result with Type2",
              "\t\t// so Apple's existing branch preserves the boot DDI AUX power well.",
              "\t\t// No PowerWell/PGE/AUX/DDI routes are restored in this stage.",
              "\t\tstatic const uint8_t st18eProbeModeDebugFind[] = {",
              "\t\t\t0x48, 0x8b, 0x08, 0x48, 0x89, 0xc7, 0xff, 0x91, 0x90, 0x01, 0x00, 0x00, 0x83, 0xf8, 0x02",
              "\t\t};",
              "\t\tstatic const uint8_t st18eProbeModeProdFind[] = {",
              "\t\t\t0x48, 0x8b, 0x08, 0x48, 0x89, 0xc7, 0xff, 0x91, 0x78, 0x01, 0x00, 0x00, 0x83, 0xf8, 0x02",
              "\t\t};",
              "\t\tstatic const uint8_t st18eProbeModeType2Replace[] = {",
              "\t\t\t0xb8, 0x02, 0x00, 0x00, 0x00, 0x90, 0x90, 0x90, 0x90, 0x90, 0x90, 0x90, 0x83, 0xf8, 0x02",
              "\t\t};",
              "",
              "\t\tif (isprod) {",
              "\t\t\tLookupPatchPlus const st18eProbeModeProdPatch[] = {",
              "\t\t\t\t{activeKext, st18eProbeModeProdFind, st18eProbeModeType2Replace, arrsize(st18eProbeModeProdFind), 1},",
              "\t\t\t};",
              "\t\t\tSYSLOG(\"ngreen\", \"ST18E:PMODE-PROD-BEFORE\");",
              "\t\t\tPANIC_COND(!LookupPatchPlus::applyAll(patcher, st18eProbeModeProdPatch, address, size), \"ngreen\", \"Stage18E failed to patch production probePortMode call\");",
              "\t\t\tSYSLOG(\"ngreen\", \"ST18E:PMODE-PROD-AFTER\");",
              "\t\t} else {",
              "\t\t\tLookupPatchPlus const st18eProbeModeDebugPatch[] = {",
              "\t\t\t\t{activeKext, st18eProbeModeDebugFind, st18eProbeModeType2Replace, arrsize(st18eProbeModeDebugFind), 1},",
              "\t\t\t};",
              "\t\t\tSYSLOG(\"ngreen\", \"ST18E:PMODE-DEBUG-BEFORE\");",
              "\t\t\tPANIC_COND(!LookupPatchPlus::applyAll(patcher, st18eProbeModeDebugPatch, address, size), \"ngreen\", \"Stage18E failed to patch debug probePortMode call\");",
              "\t\t\tSYSLOG(\"ngreen\", \"ST18E:PMODE-DEBUG-AFTER\");",
              "\t\t}",
              "",
          ])

          source = source.replace(anchor, insertion + anchor, 1)

          required_tokens = {
              "ST18E:PMODE-PROD-BEFORE": 1,
              "ST18E:PMODE-PROD-AFTER": 1,
              "ST18E:PMODE-DEBUG-BEFORE": 1,
              "ST18E:PMODE-DEBUG-AFTER": 1,
              "st18eProbeModeDebugFind": 3,
              "st18eProbeModeProdFind": 3,
              "st18eProbeModeType2Replace": 3,
          }
          for token, expected in required_tokens.items():
              actual = source.count(token)
              if actual != expected:
                  raise SystemExit(
                      f"Stage18E source safety: {token!r}: expected {expected}, found {actual}"
                  )

          source_path.write_text(source)
          PY18E

          echo "=== Stage18E probePortMode Type2-only patch ==="
          grep -n -A 36 -B 5 'ST18E:PMODE-PROD-BEFORE' NootedGreen/kern_gen11.cpp

          test "$(grep -c 'const bool st18cEnableFBRoutes = false' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'if (st18cEnableFBRoutes)' NootedGreen/kern_gen11.cpp)" -eq 3
          test "$(grep -c 'ST18E:PMODE-PROD-BEFORE' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18E:PMODE-DEBUG-BEFORE' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18D:' NootedGreen/kern_gen11.cpp)" -eq 0

