          # compile-disabled. Install a new, independent route set containing ONLY the
          # three PowerWell state wrappers required to stamp +0x78/fMMIO before callthrough.
          common_anchor = '\t\tSYSLOG("ngreen", "ST18C:FB-COMMON-ROUTES-SKIP");'
          common_insert = "\n".join([
              common_anchor,
              '\t\tRouteRequestPlus st18dPwCommonRequests[] = {',
              '\t\t\t{"__ZN19AppleIntelPowerWell21hwSetPowerWellStatePGEbj", hwSetPowerWellStatePGE, this->ohwSetPowerWellStatePGE},',
              '\t\t\t{"__ZN19AppleIntelPowerWell22hwSetPowerWellStateAuxEbj", hwSetPowerWellStateAux, this->ohwSetPowerWellStateAux},',
              '\t\t\t{"__ZN19AppleIntelPowerWell22hwSetPowerWellStateDDIEbj", hwSetPowerWellStateDDI, this->ohwSetPowerWellStateDDI},',
              '\t\t};',
              '\t\tSYSLOG("ngreen", "ST18D:PW-ROUTE-COMMON-BEFORE");',
              '\t\tPANIC_COND(!RouteRequestPlus::routeAll(patcher, index, st18dPwCommonRequests, address, size), "ngreen","Stage18D failed to route PowerWell state symbols");',
              '\t\tSYSLOG("ngreen", "ST18D:PW-ROUTE-COMMON-AFTER");',
          ])
          fb = replace_once(fb, common_anchor, common_insert, "common PowerWell route insertion")

          # Production and debug TGL binaries use different PowerWell::init signatures.
          # Re-enable only that one semantic hook in each branch; all other prod/debug
          # RouteRequestPlus entries remain behind Stage18C's false guard.
          prod_anchor = '\t\t\tSYSLOG("ngreen", "ST18C:FB-PROD-ROUTES-SKIP");'
