              'ST18D:AUX ENTER': 1,
              'ST18D:AUX RETURN': 1,
              'ST18D:DDI ENTER': 1,
              'ST18D:DDI RETURN': 1,
          }
          for token, expected in checks.items():
              count = s.count(token)
              if count != expected:
                  raise SystemExit(f"Stage18D safety: {token!r} count={count}, expected={expected}")

          if s.count('const bool st18cEnableFBRoutes = false;') != 1:
              raise SystemExit("Stage18D safety: Stage18C broad-route false guard changed")
          if s.count('if (st18cEnableFBRoutes) {') != 3:
              raise SystemExit("Stage18D safety: Stage18C three broad route guards changed")
          if 'ST11-FB10' in fb or 'ST11-FB21' in fb:
              raise SystemExit("Stage18D safety: stale Stage11 completion marker resurrected")

          p.write_text(s)
          PY18D

          echo "=== Stage18D PowerWell minimal route source ==="
          grep -n -A 12 -B 4 'ST18D:PW-ROUTE' NootedGreen/kern_gen11.cpp
          echo "=== Stage18D PowerWell runtime markers ==="
          grep -n 'ST18D:PW0\|ST18D:PGE\|ST18D:AUX\|ST18D:DDI' NootedGreen/kern_gen11.cpp

          test "$(grep -c 'const bool st18cEnableFBRoutes = false' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'if (st18cEnableFBRoutes)' NootedGreen/kern_gen11.cpp)" -eq 3
          test "$(grep -c 'ST18D:PW-ROUTE-COMMON-BEFORE' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18D:PW-ROUTE-INIT-PROD-BEFORE' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18D:PW-ROUTE-INIT-DEBUG-BEFORE' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18D:PW00' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18D:PW01' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18D:PW02' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18D:PGE ENTER' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18D:AUX ENTER' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST18D:DDI ENTER' NootedGreen/kern_gen11.cpp)" -eq 1

      - name: Build NootedGreen DEBUG
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild             -project NootedGreen.xcodeproj             -scheme NootedGreen             -configuration Debug             -derivedDataPath "$RUNNER_TEMP/DerivedData-NootedGreen"             ARCHS=x86_64             ONLY_ACTIVE_ARCH=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Build HookCase DEBUG
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild             -project HookCase-master/HookCase.xcodeproj             -scheme HookCase             -configuration Debug             -derivedDataPath "$RUNNER_TEMP/DerivedData-HookCase"             ARCHS=x86_64             ONLY_ACTIVE_ARCH=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Collect and verify artifacts
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p out/Artifacts

          NG="$(find "$RUNNER_TEMP/DerivedData-NootedGreen"             -type d -name NootedGreen.kext -print -quit)"

          HC="$(find "$RUNNER_TEMP/DerivedData-HookCase"             -type d -name HookCase.kext -print -quit)"

          test -n "$NG"
          test -n "$HC"
          test -d "$NG"
          test -d "$HC"

          ditto "$NG" out/Artifacts/NootedGreen.kext
          ditto "$HC" out/Artifacts/HookCase.kext

          {
            echo "STAGE18D REAL TGL POWERWELL MINIMAL RESTORE TEST"
            echo "Expected EFI device-id: 0x9A48"
            echo "Expected EFI framebuffer tier: -ngreentglwithgfx (KEEP NORMAL WITHGFX MODE)"
            echo "Expected EFI Stage18D args: -ngreennotcon -ngreennov500 -ngreennov221 -ngreennof2 -ngreennogfx (NO -ngreenforcefb)"
            echo "Required system state: AppleIntelTGLGraphicsFramebuffer IOPCIPrimaryMatch=0x9A488086; AppleIntelTGLGraphics IOPCIPrimaryMatch=0xFFFF8086 dummy nonmatch"
            echo "Stage18D behavior: Stage18C broad FB route groups remain disabled; only PowerWell::init plus PGE/AUX/DDI state routes are restored; debug LookupPatchPlus apply remains skipped"
            echo "Stage18D route markers: ST18D:PW-ROUTE-COMMON-{BEFORE|AFTER} plus exactly one init variant {PROD|DEBUG}-{BEFORE|AFTER}"
            echo "Stage18B debug-lookup-skip markers retained: ST18:FB-DBG-SKIP and ST18:FB-DBG-POST"
            echo "Stage16 markers retained: ST16:NOGFX-ARMED and ST16:HW-REG-SKIP"
            echo "PowerWell runtime markers: ST18D:PW00 -> ST18D:PW01 -> optional first-call PGE/AUX/DDI ENTER/RETURN -> ST18D:PW02 if original init returns"
            echo "IOAccelF2 minimal markers retained: S14:A S14:B S14:C S14:D (last visible marker is non-diagnostic; judge only boot outcome)"
            echo "Real TGL skips NootedGreen SKU/device-ID bypass"
            echo "HookCase register: 0x44470"
            echo
            echo "=== Xcode ==="
            xcodebuild -version
            echo
            echo "=== Source commit ==="
            git rev-parse HEAD
            echo
            echo "=== Source patch marker ==="
            grep -n 'STAGE10: Real TGL' NootedGreen/kern_gen11.cpp
            echo
            echo "=== Architectures ==="
            file out/Artifacts/NootedGreen.kext/Contents/MacOS/NootedGreen
            file out/Artifacts/HookCase.kext/Contents/MacOS/HookCase
          } > out/Artifacts/BUILD_INFO.txt

          (
            cd out/Artifacts
            shasum -a 256               NootedGreen.kext/Contents/MacOS/NootedGreen               HookCase.kext/Contents/MacOS/HookCase               > SHA256.txt
          )

      - name: Upload Stage18D kexts
        uses: actions/upload-artifact@v4
        with:
          name: NootedGreen-REAL-TGL-STAGE18D-POWERWELL-MINIMAL
          path: out/Artifacts
          if-no-files-found: error
          retention-days: 14
