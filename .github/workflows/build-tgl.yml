      - name: Stage16 - skip TGL HW registration before processKext
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY16'
          from pathlib import Path

          p = Path("NootedGreen/kern_gen11.cpp")
          s = p.read_text()

          init_begin = "void Gen11::init() {"
          start = s.find(init_begin)
          if start < 0:
              raise SystemExit("Stage16: Gen11::init() not found")

          # Limit all edits to Gen11::init() so other withgfx checks remain untouched.
          next_func_candidates = [
              s.find("\nvoid Gen11::", start + len(init_begin)),
              s.find("\nbool Gen11::", start + len(init_begin)),
              s.find("\nuint32_t Gen11::", start + len(init_begin)),
          ]
          next_func_candidates = [x for x in next_func_candidates if x >= 0]
          if not next_func_candidates:
              raise SystemExit("Stage16: could not find end of Gen11::init()")
          end = min(next_func_candidates)

          init = s[start:end]

          callback_line = "\tcallback = this;"
          if init.count(callback_line) != 1:
              raise SystemExit(
                  f"Stage16: expected one 'callback = this;' in Gen11::init, found {init.count(callback_line)}"
              )

          armed = "\n".join([
              callback_line,
              "",
              '\tconst bool st16NoGfx = NGreen::callback->isRealTGL && checkKernelArgument("-ngreennogfx");',
              '\tif (st16NoGfx)',
              '\t\tSYSLOG("ngreen", "ST16:NOGFX-ARMED genuine TGL HW registration isolation active");',
          ])
          init = init.replace(callback_line, armed, 1)

          old_hw = "\n".join([
              '\t\tif (checkKernelArgument("-ngreentglwithgfx")) {',
              '\t\t\tSYSLOG("ngreen", "Gen11::init: HW tier → TGL (ICL HW skipped)");',
              '\t\t\tlilu.onKextLoadForce(&kextG11HWT);',
              '\t\t\tlilu.onKextLoadForce(&kextG11HWTA);',
              '\t\t}',
          ])

          if init.count(old_hw) != 1:
              raise SystemExit(
                  f"Stage16: expected one withgfx HW registration block, found {init.count(old_hw)}"
              )

          new_hw = "\n".join([
              '\t\tif (checkKernelArgument("-ngreentglwithgfx")) {',
              '\t\t\tif (st16NoGfx) {',
              '\t\t\t\tSYSLOG("ngreen", "ST16:HW-REG-SKIP genuine TGL HW kext registration skipped");',
              '\t\t\t} else {',
              '\t\t\t\tSYSLOG("ngreen", "Gen11::init: HW tier → TGL (ICL HW skipped)");',
              '\t\t\t\tlilu.onKextLoadForce(&kextG11HWT);',
              '\t\t\t\tlilu.onKextLoadForce(&kextG11HWTA);',
              '\t\t\t}',
              '\t\t}',
          ])
          init = init.replace(old_hw, new_hw, 1)

          s = s[:start] + init + s[end:]
          p.write_text(s)
          PY16

          echo "=== Stage16 early HW registration isolation ==="
          grep -n -A 30 -B 3 'ST16:NOGFX-ARMED' NootedGreen/kern_gen11.cpp
