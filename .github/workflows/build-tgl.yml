          xcodebuild             -project NootedGreen.xcodeproj             -scheme NootedGreen             -configuration Debug             -derivedDataPath "$RUNNER_TEMP/DerivedData-NootedGreen"             ARCHS=x86_64             ONLY_ACTIVE_ARCH=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

