          # Keep that isolation and prove that the old success marker is not present.
          required = [
              'ST18C:FB-COMMON-ROUTES-SKIP',
              'ST18C:FB-PROD-ROUTES-SKIP',
              'ST18C:FB-DEBUG-ROUTES-SKIP',
              'ST18:FB-DBG-SKIP',
              'ST18:FB-DBG-POST',
              'ST11-FB99',
          ]
