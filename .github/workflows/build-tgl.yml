name: Build NootedGreen REAL TGL Stage14 F2 switch

on:
  workflow_dispatch:

jobs:
  build:
    name: Build x86_64 DEBUG kexts - Stage14 F2 switch
    runs-on: macos-15-intel

    steps:
      - name: Checkout fork at Stage12 base commit
        uses: actions/checkout@v4
        with:
          ref: 6353f5a9dc3eb63b86e20bdf661f245b9db57cee

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          uname -m

      - name: Patch HookCase for real Tiger Lake
        shell: bash
        run: |
          set -euxo pipefail
          FILE="HookCase-master/HookCase/HookCase.cpp"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("HookCase-master/HookCase/HookCase.cpp")
          s = p.read_text()

          old = "callback->readReg32(0x1638a0)"
          new = "callback->readReg32(0x44470)"

          count = s.count(old)
          if count != 2:
              raise SystemExit(
                  f"Expected exactly 2 HookCase 0x1638a0 reads, found {count}"
              )

          p.write_text(s.replace(old, new))
          PY

          test "$(grep -c 'callback->readReg32(0x44470)' "$FILE")" -eq 2
          if grep -q 'callback->readReg32(0x1638a0)' "$FILE"; then
            echo "ERROR: old 0x1638a0 read remains"
            exit 1
          fi

      - name: Disable SKU bypass on genuine Tiger Lake
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("NootedGreen/kern_gen11.cpp")
          s = p.read_text()

          begin_marker = "\t\t\tLookupPatchPlus const patchesAlways[] = {"
          next_marker = "\t\t\tif (!NGreen::callback->isRealTGL) {"

          start = s.find(begin_marker)
          if start < 0:
              raise SystemExit("Could not find patchesAlways SKU block")

          end = s.find(next_marker, start)
          if end < 0:
              raise SystemExit("Could not find following RPL-only block")

          old_block = s[start:end]

          required = [
              "SKU/device-ID bypass",
              "{activeKext, f3, r3, arrsize(f3)",
              "kextG11HWT Failed to apply base patches!",
          ]
          for token in required:
              if token not in old_block:
                  raise SystemExit(
                      f"Safety check failed: expected token missing: {token}"
                  )

          lines = [
              "\t\t\tif (!NGreen::callback->isRealTGL) {",
              "\t\t\t\tLookupPatchPlus const patchesAlways[] = {",
              "\t\t\t\t\t{activeKext, f3, r3, arrsize(f3),\t1},",
              "\t\t\t\t};",
              "\t\t\t\tPANIC_COND(!LookupPatchPlus::applyAll(patcher, patchesAlways, address, size), \"ngreen\",",
              "\t\t\t\t\t\"kextG11HWT Failed to apply base patches!\");",
              "\t\t\t} else {",
              "\t\t\t\tSYSLOG(\"ngreen\", \"STAGE10: Real TGL - skipping SKU/device-ID bypass; test uses whitelisted 0x9A48\");",
              "\t\t\t}",
              "",
          ]

          replacement = "\n".join(lines)
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

          grep -n 'STAGE10: Real TGL' NootedGreen/kern_gen11.cpp

          # Safety check: exactly one SKU-bypass patch site should remain,
          # and it must be inside the !isRealTGL branch we just created.
          test "$(grep -c 'LookupPatchPlus const patchesAlways' NootedGreen/kern_gen11.cpp)" -eq 1

      - name: Stage11 - TCON switch and scoped framebuffer checkpoints
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("NootedGreen/kern_gen11.cpp")
          s = p.read_text()

          # Scope ALL Stage11 edits to the genuine TGL framebuffer processKext branch.
          # The same routeAll text also exists later in the HW branch.
          fb_begin = 'SYSLOG("ngreen", "init AppleIntelTGLGraphicsFramebuffer");'
          fb_end = '}else if (kextG11HW.loadIndex == index) {'

          start = s.find(fb_begin)
          if start < 0:
              raise SystemExit("Stage11: could not find TGL framebuffer branch start")

          end = s.find(fb_end, start)
          if end < 0:
              raise SystemExit("Stage11: could not find TGL HW branch boundary")

          fb = s[start:end]

          def replace_once(haystack, old, new, label):
              count = haystack.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Stage11 {label}: expected exactly 1 occurrence inside "
                      f"TGL framebuffer branch, found {count}"
                  )
              return haystack.replace(old, new, 1)

          fb = replace_once(
              fb,
              'const bool enableTcon = checkKernelArgument("-ngreentglwithgfx");',
              'const bool enableTcon = checkKernelArgument("-ngreentglwithgfx") && '
              '!checkKernelArgument("-ngreennotcon");',
              "enableTcon"
          )

          fb = replace_once(
              fb,
              'SYSLOG("ngreen", "init AppleIntelTGLGraphicsFramebuffer");',
              'SYSLOG("ngreen", "init AppleIntelTGLGraphicsFramebuffer");\n'
              '\t\tSYSLOG("ngreen", "ST11-FB00 entered TGL framebuffer processKext");',
              "FB00"
          )

          route = (
              'PANIC_COND(!RouteRequestPlus::routeAll(patcher, index, requests, '
              'address, size), "ngreen","Failed to route dp symbols");'
          )
          fb = replace_once(
              fb,
              route,
              route + '\n\t\tSYSLOG("ngreen", "ST11-FB10 common routes complete");',
              "FB10"
          )

          dbg_apply = (
              'PANIC_COND(!LookupPatchPlus::applyAll(patcher, patches , address, size), '
              '"ngreen", "kextG11FBT Failed to apply dbg patches!");'
          )
          fb = replace_once(
              fb,
              dbg_apply,
              'SYSLOG("ngreen", "ST11-FB20 before debug lookup patches");\n'
              '\t\t\t' + dbg_apply + '\n'
              '\t\t\tSYSLOG("ngreen", "ST11-FB21 debug lookup patches complete");',
              "FB20/21"
          )

          # There are prod and debug enableTcon blocks. Anchor specifically to
          # the debug patch completion marker so we edit only the debug TCON path.
          dbg_tcon_anchor = (
              'SYSLOG("ngreen", "ST11-FB21 debug lookup patches complete");\n'
              '\t\t\tif (enableTcon) {'
          )
          fb = replace_once(
              fb,
              dbg_tcon_anchor,
              'SYSLOG("ngreen", "ST11-FB21 debug lookup patches complete");\n'
              '\t\t\tSYSLOG("ngreen", "ST11-FB30 TCON enabled=%d", enableTcon);\n'
              '\t\t\tif (enableTcon) {\n'
              '\t\t\t\tSYSLOG("ngreen", "ST11-FB31 before DEBUG TCON lookup patches");',
              "FB30/31"
          )

          fb = replace_once(
              fb,
              'SYSLOG("ngreen", "Path E: TCON ID patches applied (dbg)");',
              'SYSLOG("ngreen", "Path E: TCON ID patches applied (dbg)");\n'
              '\t\t\t\tSYSLOG("ngreen", "ST11-FB32 DEBUG TCON lookup patches complete");',
              "FB32"
          )

          final_return = '\n\t\treturn true;'
          if fb.count(final_return) != 1:
              raise SystemExit(
                  f"Stage11 FB99: expected one framebuffer return, "
                  f"found {fb.count(final_return)}"
              )

          fb = fb.replace(
              final_return,
              '\n\t\tSYSLOG("ngreen", "ST11-FB99 TGL framebuffer processKext complete");'
              + final_return,
              1
          )

          s = s[:start] + fb + s[end:]
          p.write_text(s)
          PY

          echo "=== Stage11 source markers ==="
          grep -n 'ST11-FB' NootedGreen/kern_gen11.cpp
          grep -n 'ngreennotcon' NootedGreen/kern_gen11.cpp

          test "$(grep -c 'ST11-FB00' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST11-FB10' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST11-FB20' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST11-FB21' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST11-FB30' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST11-FB31' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST11-FB32' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST11-FB99' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ngreennotcon' NootedGreen/kern_gen11.cpp)" -eq 1

      - name: Stage12 - IOAccelF2 checkpoints and V500 switch
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          
          p = Path("NootedGreen/kern_green.cpp")
          s = p.read_text()
          
          branch_begin = 'if (kextIOAcceleratorFamily2.loadIndex == index) {'
          branch_end = '}  else if (kextIOGraphics.loadIndex == index) {'
          
          start = s.find(branch_begin)
          if start < 0:
              raise SystemExit("Stage12: could not find IOAcceleratorFamily2 branch start")
          end = s.find(branch_end, start)
          if end < 0:
              raise SystemExit("Stage12: could not find IOGraphics branch boundary")
          
          af = s[start:end]
          
          def replace_once(haystack, old, new, label):
              count = haystack.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Stage12 {label}: expected exactly 1 occurrence inside IOAccelF2 branch, found {count}"
                  )
              return haystack.replace(old, new, 1)
          
          af = replace_once(
              af,
              'SYSLOG("NGreen", "IOAccelF2: TEXT 0x%llx size 0x%lx", address, size);',
              'SYSLOG("NGreen", "IOAccelF2: TEXT 0x%llx size 0x%lx", address, size);\n'
              '\t\tSYSLOG("ngreen", "ST12-AF00 entered IOAccelF2 processKext");',
              "AF00"
          )
          
          af = replace_once(
              af,
              '\t\tbool f2ok = p2.apply(patcher, address, size);',
              '\t\tSYSLOG("ngreen", "ST12-AF10 before f2 lookup patch");\n'
              '\t\tbool f2ok = p2.apply(patcher, address, size);',
              "AF10"
          )
          
          af = replace_once(
              af,
              'SYSLOG("NGreen", "IOAccelF2 f2 (fixed): %s", f2ok ? "OK" : "FAILED");',
              'SYSLOG("NGreen", "IOAccelF2 f2 (fixed): %s", f2ok ? "OK" : "FAILED");\n'
              '\t\tSYSLOG("ngreen", "ST12-AF11 f2 lookup patch complete ok=%d", f2ok);',
              "AF11"
          )
          
          af = replace_once(
              af,
              '\t\tRouteRequestPlus wfsRequest[] = {',
              '\t\tSYSLOG("ngreen", "ST12-AF20 before V221 routeAll");\n'
              '\t\tRouteRequestPlus wfsRequest[] = {',
              "AF20"
          )
          
          old_wfs = """\t\tif (RouteRequestPlus::routeAll(patcher, index, wfsRequest, address, size)) {
          \t\t\tSYSLOG(\"ngreen\", \"V221: hooked IOAccelEventMachine2::waitForStamp\");
          \t\t} else {
          \t\t\tpatcher.clearError();
          \t\t\tSYSLOG(\"ngreen\", \"V221: waitForStamp hook FAILED — symbol not found\");
          \t\t}"""
          new_wfs = """\t\tbool st12WfsOk = RouteRequestPlus::routeAll(patcher, index, wfsRequest, address, size);
          \t\tSYSLOG(\"ngreen\", \"ST12-AF21 V221 routeAll returned=%d\", st12WfsOk);
          \t\tif (st12WfsOk) {
          \t\t\tSYSLOG(\"ngreen\", \"V221: hooked IOAccelEventMachine2::waitForStamp\");
          \t\t} else {
          \t\t\tpatcher.clearError();
          \t\t\tSYSLOG(\"ngreen\", \"V221: waitForStamp hook FAILED — symbol not found\");
          \t\t}"""
          af = replace_once(af, old_wfs, new_wfs, "AF21/V221")
          
          old_v500 = """\t\t// V500: IOAccelLegacySurface::set_id_mode — diagnostic logger.
          \t\tRouteRequestPlus simRequest[] = {
          \t\t\t{\"__ZN20IOAccelLegacySurface11set_id_modeEjj\", wrapSetIdMode, orgSetIdMode},
          \t\t};
          \t\tif (RouteRequestPlus::routeAll(patcher, index, simRequest, address, size)) {
          \t\t\tSYSLOG(\"ngreen\", \"V500: hooked IOAccelLegacySurface::set_id_mode\");
          \t\t} else {
          \t\t\tpatcher.clearError();
          \t\t\tSYSLOG(\"ngreen\", \"V500: set_id_mode hook FAILED — symbol not found\");
          \t\t}"""
          new_v500 = """\t\t// Stage12: on genuine TGL the V500 wrapper does not alter mode bits. Allow
          \t\t// the route to be skipped to test whether this route is the timing-sensitive hang.
          \t\tconst bool st12EnableV500 = !checkKernelArgument(\"-ngreennov500\");
          \t\tSYSLOG(\"ngreen\", \"ST12-AF30 V500 enabled=%d\", st12EnableV500);
          \t\tif (st12EnableV500) {
          \t\t\tSYSLOG(\"ngreen\", \"ST12-AF31 before V500 routeAll\");
          \t\t\tRouteRequestPlus simRequest[] = {
          \t\t\t\t{\"__ZN20IOAccelLegacySurface11set_id_modeEjj\", wrapSetIdMode, orgSetIdMode},
          \t\t\t};
          \t\t\tbool st12V500Ok = RouteRequestPlus::routeAll(patcher, index, simRequest, address, size);
          \t\t\tSYSLOG(\"ngreen\", \"ST12-AF32 V500 routeAll returned=%d\", st12V500Ok);
          \t\t\tif (st12V500Ok) {
          \t\t\t\tSYSLOG(\"ngreen\", \"V500: hooked IOAccelLegacySurface::set_id_mode\");
          \t\t\t} else {
          \t\t\t\tpatcher.clearError();
          \t\t\t\tSYSLOG(\"ngreen\", \"V500: set_id_mode hook FAILED — symbol not found\");
          \t\t\t}
          \t\t} else {
          \t\t\tSYSLOG(\"ngreen\", \"ST12-AF33 V500 route skipped by -ngreennov500\");
          \t\t}
          \t\tSYSLOG(\"ngreen\", \"ST12-AF99 IOAccelF2 processKext complete\");"""
          af = replace_once(af, old_v500, new_v500, "AF30-99/V500")
          
          s = s[:start] + af + s[end:]
          p.write_text(s)
          PY

          echo "=== Stage12 IOAccelF2 source markers ==="
          grep -n 'ST12-AF' NootedGreen/kern_green.cpp
          grep -n 'ngreennov500' NootedGreen/kern_green.cpp

          for m in 00 10 11 20 21 30 31 32 33 99; do
            test "$(grep -c "ST12-AF${m}" NootedGreen/kern_green.cpp)" -eq 1
          done
          test "$(grep -c 'ngreennov500' NootedGreen/kern_green.cpp)" -eq 2

      - name: Stage13 - minimal IOAccel logging and V221 switch (safe line edits)
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY13'
          from pathlib import Path

          p = Path("NootedGreen/kern_green.cpp")
          s = p.read_text()

          branch_begin = 'if (kextIOAcceleratorFamily2.loadIndex == index) {'
          branch_end = '}  else if (kextIOGraphics.loadIndex == index) {'
          start = s.find(branch_begin)
          if start < 0:
              raise SystemExit("Stage13: could not find IOAcceleratorFamily2 branch start")
          end = s.find(branch_end, start)
          if end < 0:
              raise SystemExit("Stage13: could not find IOGraphics branch boundary")
          af = s[start:end]

          def replace_once(h, old, new, label):
              c = h.count(old)
              if c != 1:
                  raise SystemExit(f"Stage13 {label}: expected 1 occurrence, found {c}")
              return h.replace(old, new, 1)

          # IMPORTANT: do not replace a span around p2. The lookup-patch object is
          # declared between the Stage12 entry log and f2ok; deleting that span
          # caused the v2 compile failure. Only edit individual statements here.

          # Keep the original IOAccelF2 TEXT log out of the timing path and turn
          # Stage12 AF00/AF11 into short Stage13 markers.
          af = replace_once(
              af,
              'SYSLOG("NGreen", "IOAccelF2: TEXT 0x%llx size 0x%lx", address, size);',
              '/* Stage13: verbose IOAccelF2 TEXT log removed */',
              "TEXT log"
          )
          af = replace_once(
              af,
              '\t\tSYSLOG("ngreen", "ST12-AF00 entered IOAccelF2 processKext");',
              '\t\tSYSLOG("ngreen", "S13:A");',
              "AF00 -> A"
          )
          af = replace_once(
              af,
              'SYSLOG("NGreen", "IOAccelF2 f2 (fixed): %s", f2ok ? "OK" : "FAILED");',
              '/* Stage13: verbose f2 result log removed */',
              "f2 result log"
          )
          af = replace_once(
              af,
              '\t\tSYSLOG("ngreen", "ST12-AF11 f2 lookup patch complete ok=%d", f2ok);',
              '\t\tSYSLOG("ngreen", "S13:B");',
              "AF11 -> B"
          )

          # Make V221 switchable without deleting/rebuilding the request block.
          # This preserves the exact Stage12 code shape that already compiled.
          old_route = '\t\tbool st12WfsOk = RouteRequestPlus::routeAll(patcher, index, wfsRequest, address, size);'
          new_route = (
              '\t\tconst bool st13EnableV221 = !checkKernelArgument("-ngreennov221");\n'
              '\t\tbool st12WfsOk = true;\n'
              '\t\tif (st13EnableV221)\n'
              '\t\t\tst12WfsOk = RouteRequestPlus::routeAll(patcher, index, wfsRequest, address, size);'
          )
          af = replace_once(af, old_route, new_route, "V221 route switch")

          af = replace_once(
              af,
              '\t\tSYSLOG("ngreen", "ST12-AF20 before V221 routeAll");',
              '/* Stage13: AF20 log removed */',
              "AF20 remove"
          )
          af = replace_once(
              af,
              '\t\tSYSLOG("ngreen", "ST12-AF21 V221 routeAll returned=%d", st12WfsOk);',
              '\t\tSYSLOG("ngreen", "S13:C");',
              "AF21 -> C"
          )
          af = replace_once(
              af,
              '\t\t\tSYSLOG("ngreen", "V221: hooked IOAccelEventMachine2::waitForStamp");',
              '\t\t\t/* Stage13: V221 success log removed */',
              "V221 success log"
          )
          af = replace_once(
              af,
              '\t\t\tSYSLOG("ngreen", "V221: waitForStamp hook FAILED — symbol not found");',
              '\t\t\t/* Stage13: V221 failure log removed */',
              "V221 failure log"
          )

          # Stage12 already has a working -ngreennov500 switch. Keep its code and
          # only remove verbose logs, with AF99 becoming the short final marker.
          removals = [
              ('\t\tSYSLOG("ngreen", "ST12-AF30 V500 enabled=%d", st12EnableV500);', '/* Stage13: AF30 log removed */', 'AF30'),
              ('\t\t\tSYSLOG("ngreen", "ST12-AF31 before V500 routeAll");', '\t\t\t/* Stage13: AF31 log removed */', 'AF31'),
              ('\t\t\tSYSLOG("ngreen", "ST12-AF32 V500 routeAll returned=%d", st12V500Ok);', '\t\t\t/* Stage13: AF32 log removed */', 'AF32'),
              ('\t\t\t\tSYSLOG("ngreen", "V500: hooked IOAccelLegacySurface::set_id_mode");', '\t\t\t\t/* Stage13: V500 success log removed */', 'V500 success'),
              ('\t\t\t\tSYSLOG("ngreen", "V500: set_id_mode hook FAILED — symbol not found");', '\t\t\t\t/* Stage13: V500 failure log removed */', 'V500 failure'),
              ('\t\t\tSYSLOG("ngreen", "ST12-AF33 V500 route skipped by -ngreennov500");', '\t\t\t/* Stage13: AF33 log removed */', 'AF33'),
              ('\t\tSYSLOG("ngreen", "ST12-AF99 IOAccelF2 processKext complete");', '\t\tSYSLOG("ngreen", "S13:D");', 'AF99 -> D'),
          ]
          for old, new, label in removals:
              af = replace_once(af, old, new, label)

          # Sanity: the original lookup-patch expression must still exist.
          if 'bool f2ok = p2.apply(patcher, address, size);' not in af:
              raise SystemExit("Stage13 safety: f2ok/p2.apply line disappeared")
          if 'p2.apply(patcher, address, size)' not in af:
              raise SystemExit("Stage13 safety: p2 lookup patch call disappeared")

          s = s[:start] + af + s[end:]
          p.write_text(s)
          PY13

          echo "=== Stage13 minimal IOAccel markers ==="
          grep -n 'S13:' NootedGreen/kern_green.cpp
          grep -n 'ngreennov221\|ngreennov500' NootedGreen/kern_green.cpp

          for m in A B C D; do
            test "$(grep -c "S13:${m}" NootedGreen/kern_green.cpp)" -eq 1
          done
          test "$(grep -c 'ngreennov221' NootedGreen/kern_green.cpp)" -eq 1
          test "$(grep -c 'ngreennov500' NootedGreen/kern_green.cpp)" -eq 2
          test "$(grep -c 'ST12-AF' NootedGreen/kern_green.cpp)" -eq 0
          grep -n 'bool f2ok = p2.apply' NootedGreen/kern_green.cpp

      - name: Stage14 - make IOAccelF2 lookup patch switchable
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY14'
          from pathlib import Path

          p = Path("NootedGreen/kern_green.cpp")
          s = p.read_text()

          branch_begin = 'if (kextIOAcceleratorFamily2.loadIndex == index) {'
          branch_end = '}  else if (kextIOGraphics.loadIndex == index) {'
          start = s.find(branch_begin)
          if start < 0:
              raise SystemExit("Stage14: could not find IOAcceleratorFamily2 branch start")
          end = s.find(branch_end, start)
          if end < 0:
              raise SystemExit("Stage14: could not find IOGraphics branch boundary")
          af = s[start:end]

          def replace_once(h, old, new, label):
              c = h.count(old)
              if c != 1:
                  raise SystemExit(f"Stage14 {label}: expected 1 occurrence, found {c}")
              return h.replace(old, new, 1)

          af = replace_once(
              af,
              '\t\tSYSLOG("ngreen", "S13:A");',
              '\t\tSYSLOG("ngreen", "S14:A");',
              "A marker"
          )

          old_f2 = '\t\tbool f2ok = p2.apply(patcher, address, size);'
          new_f2 = "\n".join([
              '\t\tconst bool st14EnableF2 = !checkKernelArgument("-ngreennof2");',
              '\t\tbool f2ok = true;',
              '\t\tif (st14EnableF2)',
              '\t\t\tf2ok = p2.apply(patcher, address, size);',
          ])
          af = replace_once(af, old_f2, new_f2, "F2 switch")

          af = replace_once(
              af,
              '\t\tSYSLOG("ngreen", "S13:B");',
              '\t\tSYSLOG("ngreen", "S14:B");',
              "B marker"
          )
          af = replace_once(
              af,
              '\t\tSYSLOG("ngreen", "S13:C");',
              '\t\tSYSLOG("ngreen", "S14:C");',
              "C marker"
          )
          af = replace_once(
              af,
              '\t\tSYSLOG("ngreen", "S13:D");',
              '\t\tSYSLOG("ngreen", "S14:D");',
              "D marker"
          )

          s = s[:start] + af + s[end:]
          p.write_text(s)
          PY14

          echo "=== Stage14 IOAccelF2 source ==="
          grep -n 'S14:' NootedGreen/kern_green.cpp
          grep -n 'ngreennof2\|ngreennov221\|ngreennov500' NootedGreen/kern_green.cpp

          for m in A B C D; do
            test "$(grep -c "S14:${m}" NootedGreen/kern_green.cpp)" -eq 1
          done
          test "$(grep -c 'S13:' NootedGreen/kern_green.cpp)" -eq 0
          test "$(grep -c 'ngreennof2' NootedGreen/kern_green.cpp)" -eq 1
          test "$(grep -c 'ngreennov221' NootedGreen/kern_green.cpp)" -eq 1
          test "$(grep -c 'ngreennov500' NootedGreen/kern_green.cpp)" -eq 2
          grep -n 'st14EnableF2\|p2.apply' NootedGreen/kern_green.cpp

      - name: Build NootedGreen DEBUG
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild             -project NootedGreen.xcodeproj             -scheme NootedGreen             -configuration Debug             -derivedDataPath "$RUNNER_TEMP/DerivedData-NootedGreen"             ARCHS=x86_64             ONLY_ACTIVE_ARCH=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Build HookCase DEBUG
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild             -project HookCase-master/HookCase.xcodeproj             -scheme HookCase             -configuration Debug             -derivedDataPath "$RUNNER_TEMP/DerivedData-HookCase"             ARCHS=x86_64             ONLY_ACTIVE_ARCH=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Collect and verify artifacts
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p out/Artifacts

          NG="$(find "$RUNNER_TEMP/DerivedData-NootedGreen"             -type d -name NootedGreen.kext -print -quit)"

          HC="$(find "$RUNNER_TEMP/DerivedData-HookCase"             -type d -name HookCase.kext -print -quit)"

          test -n "$NG"
          test -n "$HC"
          test -d "$NG"
          test -d "$HC"

          ditto "$NG" out/Artifacts/NootedGreen.kext
          ditto "$HC" out/Artifacts/HookCase.kext

          {
            echo "STAGE14 REAL TGL IOACCEL F2/V221/V500 SWITCH TEST"
            echo "Expected EFI device-id: 0x9A48"
            echo "Expected EFI control B args: -ngreennotcon -ngreennov500 -ngreennov221"
            echo "Expected EFI Stage14-C args: -ngreennotcon -ngreennov500 -ngreennov221 -ngreennof2"
            echo "Framebuffer checkpoint markers: ST11-FB00..FB99"
            echo "IOAccelF2 minimal markers: S14:A S14:B S14:C S14:D"
            echo "Real TGL skips NootedGreen SKU/device-ID bypass"
            echo "HookCase register: 0x44470"
            echo
            echo "=== Xcode ==="
            xcodebuild -version
            echo
            echo "=== Source commit ==="
            git rev-parse HEAD
            echo
            echo "=== Source patch marker ==="
            grep -n 'STAGE10: Real TGL' NootedGreen/kern_gen11.cpp
            echo
            echo "=== Architectures ==="
            file out/Artifacts/NootedGreen.kext/Contents/MacOS/NootedGreen
            file out/Artifacts/HookCase.kext/Contents/MacOS/HookCase
          } > out/Artifacts/BUILD_INFO.txt

          (
            cd out/Artifacts
            shasum -a 256               NootedGreen.kext/Contents/MacOS/NootedGreen               HookCase.kext/Contents/MacOS/HookCase               > SHA256.txt
          )

      - name: Upload Stage14 kexts
        uses: actions/upload-artifact@v4
        with:
          name: NootedGreen-REAL-TGL-STAGE14-F2SWITCH
          path: out/Artifacts
          if-no-files-found: error
          retention-days: 14
