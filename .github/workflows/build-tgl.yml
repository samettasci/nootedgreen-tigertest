          ])
          common_new = "\n".join([
              '\t\tconst bool st18cEnableFBRoutes = false;',
              '\t\tif (st18cEnableFBRoutes) {',
              '\t\t\t' + common_call,
              '\t\t}',
              '\t\tSYSLOG("ngreen", "ST18C:FB-COMMON-ROUTES-SKIP");',
          ])
          fb = replace_once(fb, common_old, common_new, "common route group")

          prod_call = (
              'PANIC_COND(!RouteRequestPlus::routeAll(patcher, index, requests, '
              'address, size), "ngreen","Failed to route p symbols");'
          )
          prod_new = "\n".join([
              '\t\t\tif (st18cEnableFBRoutes) {',
              '\t\t\t\t' + prod_call,
              '\t\t\t}',
              '\t\t\tSYSLOG("ngreen", "ST18C:FB-PROD-ROUTES-SKIP");',
          ])
