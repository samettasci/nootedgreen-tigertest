      - name: Collect and verify artifacts
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p out/Artifacts

          NG="$(find "$RUNNER_TEMP/DerivedData-NootedGreen"             -type d -name NootedGreen.kext -print -quit)"

          HC="$(find "$RUNNER_TEMP/DerivedData-HookCase"             -type d -name HookCase.kext -print -quit)"

          test -n "$NG"
          test -n "$HC"
          test -d "$NG"
          test -d "$HC"

          ditto "$NG" out/Artifacts/NootedGreen.kext
          ditto "$HC" out/Artifacts/HookCase.kext

          {
            echo "STAGE18E REAL TGL PROBEPORTMODE TYPE2 BYPASS TEST"
            echo "Expected EFI device-id: 0x9A48"
            echo "Expected EFI framebuffer tier: -ngreentglwithgfx (KEEP NORMAL WITHGFX MODE)"
            echo "Expected EFI Stage18E args: -ngreennotcon -ngreennov500 -ngreennov221 -ngreennof2 -ngreennogfx (NO -ngreenforcefb)"
            echo "Required system state: AppleIntelTGLGraphicsFramebuffer IOPCIPrimaryMatch=0x9A488086; AppleIntelTGLGraphics IOPCIPrimaryMatch=0xFFFF8086 dummy nonmatch"
            echo "Stage18E behavior: Stage18C route-free baseline plus one exact probePortMode call-site patch that forces Type2; Stage18D PowerWell/PGE/AUX/DDI routes are absent"
            echo "Stage18E rationale: Stage18C panic PowerWell::init+0x14bb resolves exactly to the return address of AppleIntelPortHAL::probePortMode, whose vtable slot reached __cxa_pure_virtual"
            echo "Stage18E markers: exactly one pair ST18E:PMODE-{PROD|DEBUG}-{BEFORE|AFTER}"
            echo "Stage18C markers: ST18C:FB-COMMON-ROUTES-SKIP plus exactly one of ST18C:FB-PROD-ROUTES-SKIP / ST18C:FB-DEBUG-ROUTES-SKIP"
            echo "Stage18B debug-lookup-skip markers retained: ST18:FB-DBG-SKIP and ST18:FB-DBG-POST"
            echo "Stage16 markers retained: ST16:NOGFX-ARMED and ST16:HW-REG-SKIP"
            echo "Framebuffer marker path: ST11-FB00 -> ST18C:FB-COMMON-ROUTES-SKIP -> ST18C:FB-{PROD|DEBUG}-ROUTES-SKIP -> ST11-FB20 -> ST18:FB-DBG-SKIP -> ST18:FB-DBG-POST -> ST11-FB99"
            echo "IOAccelF2 minimal markers retained: S14:A S14:B S14:C S14:D (last visible marker is non-diagnostic; judge only boot outcome)"
            echo "Real TGL skips NootedGreen SKU/device-ID bypass"
            echo "HookCase register: 0x44470"
            echo
            echo "=== Xcode ==="
            xcodebuild -version
            echo
            echo "=== Source commit ==="
            git rev-parse HEAD
            echo
            echo "=== Source patch marker ==="
            grep -n 'STAGE10: Real TGL' NootedGreen/kern_gen11.cpp
            echo
            echo "=== Architectures ==="
            file out/Artifacts/NootedGreen.kext/Contents/MacOS/NootedGreen
            file out/Artifacts/HookCase.kext/Contents/MacOS/HookCase
          } > out/Artifacts/BUILD_INFO.txt

          # Avoid `strings | grep -q` under pipefail: grep exits as soon as it
          # finds a marker, which can make Xcode's strings report a broken pipe.
          NG_STRINGS="$RUNNER_TEMP/Stage18E-NootedGreen.strings.txt"
          strings out/Artifacts/NootedGreen.kext/Contents/MacOS/NootedGreen > "$NG_STRINGS"
          grep -Fq 'ST18E:PMODE-PROD-BEFORE' "$NG_STRINGS"
          grep -Fq 'ST18E:PMODE-DEBUG-BEFORE' "$NG_STRINGS"
          if grep -Fq 'ST18D:' "$NG_STRINGS"; then
            echo "ERROR: Stage18D route marker leaked into Stage18E"
            exit 1
          fi

