name: Build NootedGreen REAL TGL Stage11 TCON-OFF

on:
  workflow_dispatch:

jobs:
  build:
    name: Build x86_64 DEBUG kexts - Stage11 TCON-OFF
    runs-on: macos-15-intel

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          uname -m

      - name: Patch HookCase for real Tiger Lake
        shell: bash
        run: |
          set -euxo pipefail
          FILE="HookCase-master/HookCase/HookCase.cpp"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("HookCase-master/HookCase/HookCase.cpp")
          s = p.read_text()

          old = "callback->readReg32(0x1638a0)"
          new = "callback->readReg32(0x44470)"

          count = s.count(old)
          if count != 2:
              raise SystemExit(
                  f"Expected exactly 2 HookCase 0x1638a0 reads, found {count}"
              )

          p.write_text(s.replace(old, new))
          PY

          test "$(grep -c 'callback->readReg32(0x44470)' "$FILE")" -eq 2
          if grep -q 'callback->readReg32(0x1638a0)' "$FILE"; then
            echo "ERROR: old 0x1638a0 read remains"
            exit 1
          fi

      - name: Disable SKU bypass on genuine Tiger Lake
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("NootedGreen/kern_gen11.cpp")
          s = p.read_text()

          begin_marker = "\t\t\tLookupPatchPlus const patchesAlways[] = {"
          next_marker = "\t\t\tif (!NGreen::callback->isRealTGL) {"

          start = s.find(begin_marker)
          if start < 0:
              raise SystemExit("Could not find patchesAlways SKU block")

          end = s.find(next_marker, start)
          if end < 0:
              raise SystemExit("Could not find following RPL-only block")

          old_block = s[start:end]

          required = [
              "SKU/device-ID bypass",
              "{activeKext, f3, r3, arrsize(f3)",
              "kextG11HWT Failed to apply base patches!",
          ]
          for token in required:
              if token not in old_block:
                  raise SystemExit(
                      f"Safety check failed: expected token missing: {token}"
                  )

          lines = [
              "\t\t\tif (!NGreen::callback->isRealTGL) {",
              "\t\t\t\tLookupPatchPlus const patchesAlways[] = {",
              "\t\t\t\t\t{activeKext, f3, r3, arrsize(f3),\t1},",
              "\t\t\t\t};",
              "\t\t\t\tPANIC_COND(!LookupPatchPlus::applyAll(patcher, patchesAlways, address, size), \"ngreen\",",
              "\t\t\t\t\t\"kextG11HWT Failed to apply base patches!\");",
              "\t\t\t} else {",
              "\t\t\t\tSYSLOG(\"ngreen\", \"STAGE10: Real TGL - skipping SKU/device-ID bypass; test uses whitelisted 0x9A48\");",
              "\t\t\t}",
              "",
          ]

          replacement = "\n".join(lines)
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

          grep -n 'STAGE10: Real TGL' NootedGreen/kern_gen11.cpp

          # Safety check: exactly one SKU-bypass patch site should remain,
          # and it must be inside the !isRealTGL branch we just created.
          test "$(grep -c 'LookupPatchPlus const patchesAlways' NootedGreen/kern_gen11.cpp)" -eq 1

      - name: Stage11 - make TCON path switchable and add checkpoints
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("NootedGreen/kern_gen11.cpp")
          s = p.read_text()

          # 1) Keep normal -ngreentglwithgfx behaviour by default, but allow this
          # diagnostic build to skip only the TCON ID patch block.
          old = 'const bool enableTcon = checkKernelArgument("-ngreentglwithgfx");'
          new = 'const bool enableTcon = checkKernelArgument("-ngreentglwithgfx") && !checkKernelArgument("-ngreennotcon");'
          if s.count(old) != 1:
              raise SystemExit(f"Expected exactly one enableTcon line, found {s.count(old)}")
          s = s.replace(old, new, 1)

          # 2) Add high-level checkpoints around the exact area where the real
          # TGL machine has been intermittently freezing.
          replacements = [
              (
                  'SYSLOG("ngreen", "init AppleIntelTGLGraphicsFramebuffer");',
                  'SYSLOG("ngreen", "init AppleIntelTGLGraphicsFramebuffer");\n'
                  '\t\t\tSYSLOG("ngreen", "ST11-FB00 entered TGL framebuffer processKext");'
              ),
              (
                  'PANIC_COND(!RouteRequestPlus::routeAll(patcher, index, requests, address, size), "ngreen","Failed to route dp symbols");',
                  'PANIC_COND(!RouteRequestPlus::routeAll(patcher, index, requests, address, size), "ngreen","Failed to route dp symbols");\n'
                  '\t\t\tSYSLOG("ngreen", "ST11-FB10 common routes complete");'
              ),
              (
                  'PANIC_COND(!LookupPatchPlus::applyAll(patcher, patches , address, size), "ngreen", "kextG11FBT Failed to apply dbg patches!");',
                  'SYSLOG("ngreen", "ST11-FB20 before debug lookup patches");\n'
                  '\t\t\tPANIC_COND(!LookupPatchPlus::applyAll(patcher, patches , address, size), "ngreen", "kextG11FBT Failed to apply dbg patches!");\n'
                  '\t\t\tSYSLOG("ngreen", "ST11-FB21 debug lookup patches complete");'
              ),
              (
                  'if (enableTcon) {\n\t\t\t\tLookupPatchPlus const tconPatches[] = {',
                  'SYSLOG("ngreen", "ST11-FB30 TCON enabled=%d", enableTcon);\n'
                  '\t\t\tif (enableTcon) {\n'
                  '\t\t\t\tSYSLOG("ngreen", "ST11-FB31 before TCON lookup patches");\n'
                  '\t\t\t\tLookupPatchPlus const tconPatches[] = {'
              ),
              (
                  'SYSLOG("ngreen", "Path E: TCON ID patches applied (dbg)");',
                  'SYSLOG("ngreen", "Path E: TCON ID patches applied (dbg)");\n'
                  '\t\t\t\tSYSLOG("ngreen", "ST11-FB32 TCON lookup patches complete");'
              ),
          ]

          for old_text, new_text in replacements:
              count = s.count(old_text)
              if count != 1:
                  raise SystemExit(
                      f"Stage11 checkpoint safety check failed: expected 1 occurrence, found {count}: {old_text[:80]}"
                  )
              s = s.replace(old_text, new_text, 1)

          # Add a final marker before the TGL framebuffer branch returns.
          marker = '\n\t\t\treturn true;\n\t\t\t\n\t\t}else if (kextG11HW.loadIndex == index) {'
          replacement = (
              '\n\t\t\tSYSLOG("ngreen", "ST11-FB99 TGL framebuffer processKext complete");'
              '\n\t\t\treturn true;\n\t\t\t\n\t\t}else if (kextG11HW.loadIndex == index) {'
          )
          if s.count(marker) != 1:
              raise SystemExit(f"Expected framebuffer return marker once, found {s.count(marker)}")
          s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY

          grep -n 'ST11-FB' NootedGreen/kern_gen11.cpp
          grep -n 'ngreennotcon' NootedGreen/kern_gen11.cpp

      - name: Build NootedGreen DEBUG
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild             -project NootedGreen.xcodeproj             -scheme NootedGreen             -configuration Debug             -derivedDataPath "$RUNNER_TEMP/DerivedData-NootedGreen"             ARCHS=x86_64             ONLY_ACTIVE_ARCH=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Build HookCase DEBUG
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild             -project HookCase-master/HookCase.xcodeproj             -scheme HookCase             -configuration Debug             -derivedDataPath "$RUNNER_TEMP/DerivedData-HookCase"             ARCHS=x86_64             ONLY_ACTIVE_ARCH=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Collect and verify artifacts
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p out/Artifacts

          NG="$(find "$RUNNER_TEMP/DerivedData-NootedGreen"             -type d -name NootedGreen.kext -print -quit)"

          HC="$(find "$RUNNER_TEMP/DerivedData-HookCase"             -type d -name HookCase.kext -print -quit)"

          test -n "$NG"
          test -n "$HC"
          test -d "$NG"
          test -d "$HC"

          ditto "$NG" out/Artifacts/NootedGreen.kext
          ditto "$HC" out/Artifacts/HookCase.kext

          {
            echo "STAGE11 REAL TGL TCON-OFF CHECKPOINT TEST"
            echo "Expected EFI device-id: 0x9A48"
            echo "Expected boot arg: -ngreennotcon"
            echo "Framebuffer checkpoint markers: ST11-FB00..FB99"
            echo "Real TGL skips NootedGreen SKU/device-ID bypass"
            echo "HookCase register: 0x44470"
            echo
            echo "=== Xcode ==="
            xcodebuild -version
            echo
            echo "=== Source commit ==="
            git rev-parse HEAD
            echo
            echo "=== Source patch marker ==="
            grep -n 'STAGE10: Real TGL' NootedGreen/kern_gen11.cpp
            echo
            echo "=== Architectures ==="
            file out/Artifacts/NootedGreen.kext/Contents/MacOS/NootedGreen
            file out/Artifacts/HookCase.kext/Contents/MacOS/HookCase
          } > out/Artifacts/BUILD_INFO.txt

          (
            cd out/Artifacts
            shasum -a 256               NootedGreen.kext/Contents/MacOS/NootedGreen               HookCase.kext/Contents/MacOS/HookCase               > SHA256.txt
          )

      - name: Upload Stage10 kexts
        uses: actions/upload-artifact@v4
        with:
          name: NootedGreen-REAL-TGL-STAGE11-TCONOFF
          path: out/Artifacts
          if-no-files-found: error
          retention-days: 14
