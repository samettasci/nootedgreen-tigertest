          end = s.find(fb_end, start)
          if end < 0:
              raise SystemExit("Stage18C: TGL HW branch boundary not found")

          fb = s[start:end]

          def replace_once(h, old, new, label):
              count = h.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Stage18C {label}: expected exactly one target, found {count}"
                  )
              return h.replace(old, new, 1)

          common_call = (
              'PANIC_COND(!RouteRequestPlus::routeAll(patcher, index, requests, '
