          test "$(grep -c 'ST16:NOGFX-ARMED' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'ST16:HW-REG-SKIP' NootedGreen/kern_gen11.cpp)" -eq 1
          test "$(grep -c 'const bool st16NoGfx' NootedGreen/kern_gen11.cpp)" -eq 1

