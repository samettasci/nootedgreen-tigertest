      - name: Stage18C - compile-disable every TGL framebuffer route group
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY18C'
          from pathlib import Path

          p = Path("NootedGreen/kern_gen11.cpp")
          s = p.read_text()

          fb_begin = 'SYSLOG("ngreen", "init AppleIntelTGLGraphicsFramebuffer");'
          fb_end = '}else if (kextG11HW.loadIndex == index) {'
