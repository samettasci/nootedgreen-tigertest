              fb, '\t\t\t' + prod_call, prod_new, "production route group"
          )

          debug_call = (
              'PANIC_COND(!RouteRequestPlus::routeAll(patcher, index, requests, '
              'address, size), "ngreen","Failed to route d symbols");'
          )
          debug_new = "\n".join([
              '\t\t\tif (st18cEnableFBRoutes) {',
              '\t\t\t\t' + debug_call,
              '\t\t\t}',
              '\t\t\tSYSLOG("ngreen", "ST18C:FB-DEBUG-ROUTES-SKIP");',
          ])
